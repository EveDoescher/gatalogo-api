services:
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    container_name: gatalogo-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: gatalogo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gatalogo}
      POSTGRES_USER: ${POSTGRES_USER:-gatalogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gatalogo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gatalogo-api
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_ROLE: all
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/service/storage


  vision-worker:
    # Mantido opcional: SAM 2 + DINOv2 em CPU é intencionalmente lento e não
    # deve disputar recursos com a API durante o uso normal.
    profiles: ["vision"]
    build:
      context: .
      dockerfile: Dockerfile.vision
    container_name: gatalogo-vision-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Código montado no ambiente local: ajustes do worker e benchmark não
      # exigem reconstruir a imagem grande de PyTorch/SAM 2.
      - ./app:/service/app:ro
      - ./scripts:/service/scripts:ro
      - ./storage:/service/storage
      - ./.model-cache:/service/.model-cache
      - ./data:/service/data:ro
      # Dataset do benchmark, somente leitura. Nao e usado pelo worker normal.
      - ./benchmark:/service/benchmark:ro
      - ./outputs:/service/outputs

volumes:
  gatalogo_postgres_data:
