name: Code quality

on:
  pull_request:
  push:
    branches: [main, code-quality-cleanup]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.17.1
      - run: python -m ruff check .
